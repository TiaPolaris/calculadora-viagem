<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo de Viagem</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 420px; width: 100%; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .checkbox-container { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 14px; cursor: pointer; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #resultado { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 5px; display: none; line-height: 1.6; }
        .loading { text-align: center; color: #666; font-style: italic; display: none; margin-top: 15px; }
        .cidades-detectadas { font-size: 0.85em; color: #666; margin-bottom: 10px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>Custo da Viagem 🚗</h2>
    
    <label>Cidade de Origem</label>
    <input type="text" id="origem" placeholder="Ex: Dourado, SP">

    <label>Cidade de Destino</label>
    <input type="text" id="destino" placeholder="Ex: Araraquara, SP">

    <label>Preço do Combustível (R$/L)</label>
    <input type="text" id="preco" placeholder="Ex: 5,80">

    <label>Consumo do Veículo (km/L)</label>
    <input type="text" id="consumo" placeholder="Ex: 12,5">

    <label>Valor Total dos Pedágios (R$)</label>
    <input type="text" id="pedagio" placeholder="Ex: 15,00" value="0">
    
    <label class="checkbox-container">
        <input type="checkbox" id="estimarPedagio" onchange="alternarPedagioAuto()">
        Estimar pedágio automático (~R$ 0,12/km)
    </label>

    <button onclick="calcularViagem()">Calcular Viagem</button>

    <div class="loading" id="loading">Buscando cidades e calculando rota...</div>
    
    <div id="resultado"></div>
</div>

<script>
    // Função para converter texto com vírgula em número válido
    function converterParaNumero(valor) {
        if (!valor) return 0;
        let limpo = valor.toString().replace(',', '.').trim();
        return parseFloat(limpo);
    }

    function alternarPedagioAuto() {
        const campoPedagio = document.getElementById('pedagio');
        const estimar = document.getElementById('estimarPedagio').checked;
        if (estimar) {
            campoPedagio.disabled = true;
            campoPedagio.placeholder = "Calculado automaticamente";
            campoPedagio.value = "";
        } else {
            campoPedagio.disabled = false;
            campoPedagio.placeholder = "Ex: 15,00";
            campoPedagio.value = "0";
        }
    }

    async function obterCoordenadas(cidade) {
        // Busca com restrição para o Brasil e limite de 1 resultado
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cidade)}&countrycodes=br&limit=1`;
        
        const resposta = await fetch(url, {
            headers: { 'Accept-Language': 'pt-BR,pt;q=0.9' }
        });
        
        const dados = await resposta.json();
        if (!dados || dados.length === 0) {
            throw new Error(`Não foi possível localizar a cidade "${cidade}". Tente adicionar o estado (ex: ${cidade}, SP).`);
        }
        
        return { 
            lat: dados[0].lat, 
            lon: dados[0].lon, 
            nomeExibicao: dados[0].display_name.split(',')[0] + ' - ' + (dados[0].display_name.split(',')[2] || '') 
        };
    }

    async function obterDistancia(coordOrigem, coordDestino) {
        const url = `https://router.project-osrm.org/route/v1/driving/${coordOrigem.lon},${coordOrigem.lat};${coordDestino.lon},${coordDestino.lat}?overview=false`;
        const resposta = await fetch(url);
        const dados = await resposta.json();
        
        if (dados.code !== "Ok" || !dados.routes || dados.routes.length === 0) {
            throw new Error("Não foi possível traçar uma rota de carro entre as cidades informadas.");
        }
        
        return dados.routes[0].distance / 1000; // Converte metros para km
    }

    async function calcularViagem() {
        const origemInput = document.getElementById('origem').value;
        const destinoInput = document.getElementById('destino').value;
        const preco = converterParaNumero(document.getElementById('preco').value);
        const consumo = converterParaNumero(document.getElementById('consumo').value);
        const estimarPedagio = document.getElementById('estimarPedagio').checked;
        
        let pedagio = converterParaNumero(document.getElementById('pedagio').value);

        const resultadoDiv = document.getElementById('resultado');
        const loadingDiv = document.getElementById('loading');

        if (!origemInput || !destinoInput) {
            alert("Por favor, digite as cidades de origem e destino.");
            return;
        }

        if (isNaN(preco) || preco <= 0 || isNaN(consumo) || consumo <= 0) {
            alert("Por favor, informe valores válidos para o preço do combustível e para o consumo.");
            return;
        }

        resultadoDiv.style.display = 'none';
        loadingDiv.style.display = 'block';

        try {
            const coordOrigem = await obterCoordenadas(origemInput);
            const coordDestino = await obterCoordenadas(destinoInput);
            const distanciaKm = await obterDistancia(coordOrigem, coordDestino);

            if (estimarPedagio) {
                pedagio = distanciaKm * 0.12;
            }

            const litrosNecessarios = distanciaKm / consumo;
            const custoCombustivel = litrosNecessarios * preco;
            const custoTotal = custoCombustivel + pedagio;

            resultadoDiv.innerHTML = `
                <div class="cidades-detectadas">
                    📍 <strong>Rota:</strong> ${coordOrigem.nomeExibicao} ➔ ${coordDestino.nomeExibicao}
                </div>
                <strong>Distância rodoviária:</strong> ${distanciaKm.toFixed(1)} km <br>
                <strong>Combustível necessário:</strong> ${litrosNecessarios.toFixed(1)} Litros <br>
                <strong>Custo com Combustível:</strong> R$ ${custoCombustivel.toFixed(2)} <br>
                <strong>Pedágio ${estimarPedagio ? '(Estimado)' : ''}:</strong> R$ ${pedagio.toFixed(2)} <br>
                <hr>
                <strong>Custo Total Estimado:</strong> <br>
                <span style="color: #28a745; font-size: 1.3em; font-weight: bold;">R$ ${custoTotal.toFixed(2)}</span>
            `;
            resultadoDiv.style.display = 'block';
        } catch (error) {
            alert("Atenção: " + error.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
